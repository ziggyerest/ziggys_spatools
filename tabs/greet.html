<div id="page-greet" class="page" style="max-width:1100px;padding:24px 20px">

  <div class="greet-hero">
    <div class="greet-hero-inner">
      <div class="greet-hero-icon">✈️</div>
      <div>
        <div class="greet-hero-title">Greetings Library</div>
        <div class="greet-hero-sub">Click any card to copy it instantly · Name updates everything</div>
      </div>
      <div class="greet-name-pill">
        <span class="greet-name-label">✏ Name</span>
        <input id="greet-name" type="text" placeholder="Ziggy" value="Ziggy" oninput="renderGreetings()">
      </div>
      <div class="greet-name-pill"><span class="greet-name-label">✏ Gate</span><input id="greet-gate" type="text" placeholder="12" oninput="renderGreetings()"></div>
      <div class="greet-name-pill"><span class="greet-name-label">✏ Airport</span><input id="greet-airport" type="text" placeholder="Punta Cana" oninput="renderGreetings()"></div>
    </div>
  </div>

  <div class="greet-pill-row" id="greet-tabs"></div>
  <div class="greet-cat-header" id="greet-cat-header"></div>
  <div class="greet-grid" id="greet-panels"></div>

</div>
